services:
  - type: web
    name: clipforge-experiment
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: MAX_VIDEO_SECONDS
        value: '1500'
      - key: MAX_UPLOAD_MB
        value: '200'
      - key: CLIP_COUNT
        value: '3'
